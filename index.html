    <script type="application/ld+json" id="fmb-base-schema">
      {

          {

            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do I order custom cakes or eggless birthday cakes from local home bakers on FindMyBites?",
                "acceptedAnswer": {

                  "text": "Tap Near Me or browse your city and locality on FindMyBites to discover verified home bakers in Hyderabad, Bengaluru, Mumbai, Delhi NCR, Chennai, Pune, Kolkata & across India. Compare real cake prices in INR and chat directly on WhatsApp with 0% commission."
